<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Appointment - Hospital System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-danger px-4">
        <span class="navbar-brand">Hospital System</span>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm me-2">Home</a>
            <a href="/appointments" class="btn btn-outline-light btn-sm me-2">Appointments</a>
            <span class="text-white me-3">👤 {{ session["username"] }}</span>
            <a href="/logout" class="btn btn-light btn-sm">Logout</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm">
                    <h4 class="mb-4">Add Appointment</h4>
                    <form method="POST" action="/add_appointment">
                        <div class="mb-3">
                            <label>Patient</label>
                            <select name="patient_id" class="form-control" required>
                                <option value="">-- Select Patient --</option>
                                {% for patient in patients %}
                                <option value="{{ patient['id'] }}">{{ patient['name'] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Doctor Name</label>
                            <input type="text" name="doctor_name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Date</label>
                            <input type="date" name="appointment_date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Time</label>
                            <input type="time" name="appointment_time" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Reason</label>
                            <input type="text" name="reason" class="form-control" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger w-100">Book Appointment</button>
                            <a href="/appointments" class="btn btn-secondary w-100">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
