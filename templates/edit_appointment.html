<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Appointment - Hospital System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-danger px-4">
        <span class="navbar-brand">Hospital System</span>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm me-2">Home</a>
            <a href="/appointments" class="btn btn-outline-light btn-sm me-2">Appointments</a>
            <span class="text-white me-3">👤 {{ session["username"] }}</span>
            <a href="/logout" class="btn btn-light btn-sm">Logout</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm">
                    <h4 class="mb-4">Edit Appointment</h4>
                    <form method="POST" action="/edit_appointment/{{ appointment['id'] }}">
                        <div class="mb-3">
                            <label>Doctor Name</label>
                            <input type="text" name="doctor_name" class="form-control" value="{{ appointment['doctor_name'] }}" required>
                        </div>
                        <div class="mb-3">
                            <label>Date</label>
                            <input type="date" name="appointment_date" class="form-control" value="{{ appointment['appointment_date'] }}" required>
                        </div>
                        <div class="mb-3">
                            <label>Time</label>
                            <input type="time" name="appointment_time" class="form-control" value="{{ appointment['appointment_time'] }}" required>
                        </div>
                        <div class="mb-3">
                            <label>Reason</label>
                            <input type="text" name="reason" class="form-control" value="{{ appointment['reason'] }}" required>
                        </div>
                        <div class="mb-3">
                            <label>Status</label>
                            <select name="status" class="form-control">
                                <option value="pending" {% if appointment['status'] == 'pending' %}selected{% endif %}>Pending</option>
                                <option value="completed" {% if appointment['status'] == 'completed' %}selected{% endif %}>Completed</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning w-100">Update</button>
                            <a href="/appointments" class="btn btn-secondary w-100">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
